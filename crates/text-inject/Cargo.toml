[package]
name = "text-inject"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-graphics = "0.23"
accessibility = "0.1"

# windows-rs (Microsoft's official bindings) for UI Automation (selection
# read) + SendInput (Ctrl+C/Ctrl+V simulation); clipboard-win for the
# CF_UNICODETEXT clipboard get/set. Gated to the Windows target only so
# this never affects the Linux/macOS dependency graph or build.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
] }
clipboard-win = "5"
