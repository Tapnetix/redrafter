name: CI

# Mirrors the local gates the dev workflow enforced, so the CI-reconciliation
# gate can't diverge from what was verified locally:
#   - Rust: build + full test suite (cargo-nextest, per-test process isolation
#     — required because the GTK/AppKit tray init SIGSEGVs/panics under a shared
#     test process) + clippy -D warnings.
#   - Frontend: type-check, unit tests (vitest), and the Playwright E2E suite.
#   - Cross-platform: a cargo check matrix across Linux/macOS/Windows so the
#     text-inject (macos.rs/linux.rs/windows.rs) + permission/hotkey/tray cfg
#     paths all keep compiling against each real SDK.
#
# generate_context! needs the static frontend export (app/out) to exist before
# any cargo build/test of the redrafter app crate, so every Rust job runs
# `pnpm build` first.

on:
  push:
    branches: [main, 'integrate/**']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (tsc + vitest + playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run --coverage
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --project=chromium

  rust:
    name: Rust (build + nextest + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }
      - name: Build frontend (needed by generate_context!)
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - run: cargo build --workspace
      - run: cargo nextest run --workspace
      - run: cargo clippy -p redrafter -p llm-provider -p text-inject -- -D warnings

  cross-platform-check:
    name: Cross-platform build check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build frontend (needed by generate_context!)
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      # Validates the per-OS cfg paths (text-inject macos/linux/windows,
      # permission/hotkey/tray) compile against each real platform SDK.
      - run: cargo check --workspace
