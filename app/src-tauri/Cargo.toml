[package]
name = "redrafter"
version = "0.1.7"
edition = "2021"
license = "MIT"

[lib]
name = "redrafter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
rusqlite = { version = "0.31", features = ["bundled"] }
llm-provider = { path = "../../crates/llm-provider" }
text-inject = { path = "../../crates/text-inject" }
# lifecycle.rs (C2): `UpdateApplier`'s async trait method, mirroring
# `llm-provider`'s own `LlmProvider` trait -- promoted from a dev-only
# dependency (used there for in-test fakes) to a real one since this trait
# lives in production code, not just `#[cfg(test)]`.
async-trait = "0.1"
# B10 (secrets.rs): AES-256-GCM for the default encrypted-file key store,
# plus the base64 encoding its on-disk (nonce || ciphertext+tag) blobs use.
# Both were already resolved transitively (via reqwest/tauri's TLS stack),
# so pulling them in directly keeps the `Cargo.lock` diff to "promote to a
# direct dependency" rather than a new subtree.
ring = "0.17"
base64 = "0.22"

# B10 (secrets.rs): the opt-in OS-keychain backend. macOS-only -- every
# other target compiles a stub (see `secrets::KeychainBackend`) so the crate
# still builds (and its tests still run) off macOS; the real keychain path
# is verified on macOS hardware separately.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
# `tauri`'s "test" feature powers `tests/wireup_test.rs` (MockRuntime +
# `tauri::test::get_ipc_response`), letting it assert the production invoke
# handler's registered command set without a real window/OS integration.
tauri = { version = "2", features = ["tray-icon", "test"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
